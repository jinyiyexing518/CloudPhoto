# =============================================================================
# CloudPhoto — Nginx Reverse Proxy Config
# Replace YOUR_DOMAIN with your actual domain before use,
# OR let setup.sh do the substitution automatically.
#
# Upstreams:
#   Frontend  →  Azure Static Web App
#   /api/     →  Azure Functions
# =============================================================================

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cloudphotos.top www.cloudphotos.top;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloudphotos.top www.cloudphotos.top;

    # SSL — managed by Certbot (added automatically after first run)
    ssl_certificate     /etc/letsencrypt/live/cloudphotos.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudphotos.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Allow large uploads (videos up to 200 MB + headroom)
    client_max_body_size 210m;

    # ── /api/ → Azure Functions ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         https://cloudphoto-api.azurewebsites.net/api/;
        proxy_http_version 1.1;

        # Must match the upstream Host for SNI + Azure routing
        proxy_set_header   Host                cloudphoto-api.azurewebsites.net;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;

        # Long timeouts for video uploads (up to 10 min)
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;

        # Pass Authorization header through (JWT tokens)
        proxy_pass_header  Authorization;
    }


    # ── /media/ → Azure Blob Storage (photo/video proxy for China mainland) ────
    # Client rewrites blob SAS URLs to /media/{path}?{sasParams} on cloudphotos.top
    # so all photo/thumbnail/video traffic flows through the VM (Singapore → East Asia
    # on Azure backbone) instead of the user connecting to blob storage directly.
    location /media/ {
        proxy_pass            https://photostorage.blob.core.windows.net/photos/;
        proxy_http_version    1.1;
        proxy_ssl_server_name on;
        proxy_set_header      Host              photostorage.blob.core.windows.net;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      Connection        "";  # enable upstream keep-alive

        # Disable buffering so video range requests stream immediately.
        # With buffering on, Nginx downloads from Azure Blob before forwarding
        # which adds latency for the first bytes of large video files.
        proxy_buffering         off;
        proxy_buffers           32 256k;
        proxy_buffer_size       256k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 1024m;

        # Long read timeout for large video downloads
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Tell browsers to cache media for 1 hour (within the 2h SAS validity window).
        # The Service Worker (PWA) caches by path (ignoring SAS params) for 7 days —
        # this header is the fallback for non-SW browsers.
        # proxy_hide_header removes any restrictive Cache-Control from Azure Blob.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=7200" always;
    }

    # ── / → Azure Static Web App (only small HTML responses go through VM)
    location / {
        proxy_pass         https://brave-sand-053b07a00.7.azurestaticapps.net;
        proxy_http_version 1.1;

        proxy_set_header   Host                brave-sand-053b07a00.7.azurestaticapps.net;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;

        proxy_read_timeout 60s;
    }
}
