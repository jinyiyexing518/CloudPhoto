# =============================================================================
# CloudPhoto — Nginx Reverse Proxy Config
# Replace YOUR_DOMAIN with your actual domain before use,
# OR let setup.sh do the substitution automatically.
#
# Upstreams:
#   Frontend  →  Azure Static Web App
#   /api/     →  Azure Functions
# =============================================================================

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cloudphotos.top www.cloudphotos.top;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloudphotos.top www.cloudphotos.top;

    # SSL — managed by Certbot (added automatically after first run)
    ssl_certificate     /etc/letsencrypt/live/cloudphotos.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudphotos.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Allow large uploads (videos up to 200 MB + headroom)
    client_max_body_size 210m;

    # ── /api/ → Azure Functions ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         https://cloudphoto-api.azurewebsites.net/api/;
        proxy_http_version 1.1;

        # Must match the upstream Host for SNI + Azure routing
        proxy_set_header   Host                cloudphoto-api.azurewebsites.net;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;

        # Long timeouts for video uploads (up to 10 min)
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;

        # Pass Authorization header through (JWT tokens)
        proxy_pass_header  Authorization;
    }

    # ── / → Azure Static Web App ─────────────────────────────────────────────
    location / {
        proxy_pass         https://brave-sand-053b07a00.7.azurestaticapps.net;
        proxy_http_version 1.1;

        proxy_set_header   Host                brave-sand-053b07a00.7.azurestaticapps.net;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;

        # WebSocket support (used by Vite HMR in dev; harmless in prod)
        proxy_set_header   Upgrade             $http_upgrade;
        proxy_set_header   Connection          "upgrade";

        proxy_read_timeout 60s;
    }
}
