# =============================================================================
# CloudPhoto — Nginx Reverse Proxy Config
# Replace YOUR_DOMAIN with your actual domain before use,
# OR let setup.sh do the substitution automatically.
#
# Upstreams:
#   Frontend  →  Azure Static Web App
#   /api/     →  Azure Functions
# =============================================================================

# Allow only CloudPhoto's own web entries to use this VM as a cross-origin
# fallback. An empty value suppresses the header for every other origin.
map $http_origin $cloudphoto_cors_origin {
    default "";
    "~^https://([a-z0-9-]+\.)?cloudphotos\.(top|cn)$" $http_origin;
    "https://brave-sand-053b07a00.7.azurestaticapps.net" $http_origin;
}

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cloudphotos.top www.cloudphotos.top cn.cloudphotos.top;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloudphotos.top www.cloudphotos.top cn.cloudphotos.top;

    # SSL — managed by Certbot (added automatically after first run)
    ssl_certificate     /etc/letsencrypt/live/cloudphotos.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudphotos.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Allow large uploads (videos up to 200 MB + headroom)
    client_max_body_size 210m;

    # Gzip — compress API JSON responses (photo list can be 1-3 MB uncompressed).
    # gzip_types is explicit: images/videos from /media/ are already compressed
    # binaries and must NOT be gzip'd (would waste CPU and increase size).
    gzip              on;
    gzip_types        application/json text/plain text/css application/javascript text/xml application/xml;
    gzip_proxied      any;    # compress even when upstream sends Cache-Control: no-store
    gzip_min_length   1000;   # skip tiny responses
    gzip_comp_level   5;      # level 5: good ratio, fast enough for 2-3 MB JSON
    gzip_vary         on;     # add Vary: Accept-Encoding so caches handle it right

    # Lightweight endpoint for GeoDNS and uptime probes. It must not fall
    # through to the SPA, where a 200 HTML response would look healthy.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 200 '{"status":"ok","route":"cloudphoto-proxy"}';
    }

    # ── /api/ → Azure Functions ──────────────────────────────────────────────
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cloudphoto_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            return 204;
        }

        proxy_pass         https://cloudphoto-api.azurewebsites.net/api/;
        proxy_http_version 1.1;

        # Must match the upstream Host for SNI + Azure routing
        proxy_set_header   Host                cloudphoto-api.azurewebsites.net;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;

        # Long timeouts for video uploads (up to 10 min)
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;

        # Pass Authorization header through (JWT tokens)
        proxy_pass_header  Authorization;

        # The overseas frontend can use this endpoint when Azure Functions is
        # unreachable from the user's network.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin $cloudphoto_cors_origin always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }


    # ── /media/ → Azure Blob Storage (photo/video proxy for China mainland) ────
    # Client rewrites blob SAS URLs to /media/{path}?{sasParams} on cloudphotos.top
    # so all photo/thumbnail/video traffic flows through the VM (Singapore → East Asia
    # on Azure backbone) instead of the user connecting to blob storage directly.
    location /media/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cloudphoto_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary Origin always;
            add_header Content-Length 0;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            return 204;
        }

        proxy_pass            https://photostorage.blob.core.windows.net/photos/;
        proxy_http_version    1.1;
        proxy_ssl_server_name on;
        proxy_set_header      Host              photostorage.blob.core.windows.net;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      Connection        "";  # enable upstream keep-alive
        proxy_set_header      Range             $http_range;
        proxy_set_header      If-Range          $http_if_range;

        # Adaptive buffering: small buffer (128 KB) + no disk overflow.
        # Thumbnails / images (20-50 KB) fit entirely in the buffer → downloaded
        # at Azure backbone speed and served immediately.
        # Videos / large files exceed the buffer; Nginx falls through to pass-
        # through mode (equivalent to proxy_buffering off) so range requests
        # stream without the overhead of writing hundreds of MB to disk.
        proxy_buffering         on;
        proxy_buffers           8 16k;
        proxy_buffer_size       16k;
        proxy_busy_buffers_size 32k;
        proxy_max_temp_file_size 0;   # no disk overflow — large files stream directly

        # Long read timeout for large video downloads
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Tell browsers (and CDNs) that byte-range requests are supported.
        # Enables the browser to:
        #   1. Fetch the beginning of the file (moov area)
        #   2. Fetch the end of the file (moov for non-faststart MP4)
        #   3. Seek to arbitrary positions without re-downloading
        add_header Accept-Ranges bytes always;

        # Browser-private freshness is bounded below the 2h SAS validity window.
        # The authenticated PWA cache is separately cleared on logout/account change.
        # proxy_hide_header removes any restrictive Cache-Control from Azure Blob.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=3600, immutable" always;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cloudphoto_cors_origin always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
        add_header Vary Origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # ── / → Azure Static Web App (only small HTML responses go through VM)
    location / {
        proxy_pass         https://brave-sand-053b07a00.7.azurestaticapps.net;
        proxy_http_version 1.1;

        proxy_set_header   Host                brave-sand-053b07a00.7.azurestaticapps.net;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_ssl_server_name on;

        proxy_read_timeout 60s;
    }
}
