name: Deploy Backend (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - "packages/algorithm/src/**"
      - "packages/algorithm/package.json"
      - "packages/algorithm/tsconfig.json"
      - "packages/server/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/production-health.yml"
      - "scripts/check-backend-deployment-target.mjs"
      - "scripts/check-backend-package-dependencies.mjs"
      - "scripts/check-frontend-deployment-ownership.mjs"
      - "scripts/check-workflow-runtime-contracts.mjs"
      - "scripts/classify-deployment-event.mjs"
      - "scripts/png-contract.mjs"
      - "scripts/production-smoke.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref == 'refs/heads/main' && 'production' || format('validation-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout target history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup target Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify backend deployment target before Azure login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-backend-deployment-target.mjs --requeue-current

  build:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build revision
        uses: actions/checkout@v5

      - name: Setup build Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Verify workflow runtimes
        run: node scripts/check-workflow-runtime-contracts.mjs

      - name: Test backend deployment policy
        run: node --test scripts/backend-deployment-target.test.mjs scripts/production-smoke.test.mjs scripts/workflow-runtime-contracts.test.mjs

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn workspace cloudphoto-server build

      - name: Test backend
        run: yarn workspace cloudphoto-server test:unit

      - name: Create deployment package
        run: |
          mkdir -p deploy-stage
          cp -r packages/server/dist deploy-stage/
          cp packages/server/package.json deploy-stage/
          cp packages/server/host.json deploy-stage/
          cp yarn.lock deploy-stage/
          cp packages/server/.funcignore deploy-stage/ 2>/dev/null || true
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > deploy-stage/deployment.json
          cd deploy-stage
          yarn install --frozen-lockfile --production --offline --non-interactive
          cd ..
          node scripts/check-backend-package-dependencies.mjs
          cd deploy-stage
          # Azure Functions runs on Windows — directly download the Windows sharp binary
          # from npm registry, bypassing npm's platform check entirely.
          SHARP_VER=$(node -e "console.log(require('./node_modules/sharp/package.json').version)")
          SHARP_TARBALL="sharp-win32-x64-${SHARP_VER}.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$SHARP_TARBALL" \
            "https://registry.npmjs.org/@img/sharp-win32-x64/-/${SHARP_TARBALL}"
          cd ..
          node scripts/check-backend-package-dependencies.mjs \
            --verify-windows-sharp "deploy-stage/${SHARP_TARBALL}" "$SHARP_VER"
          cd deploy-stage
          mkdir -p node_modules/@img/sharp-win32-x64
          tar xzf "$SHARP_TARBALL" --strip-components=1 -C node_modules/@img/sharp-win32-x64
          rm "$SHARP_TARBALL"
          zip -r ../deployment.zip .

      - name: Stage backend deployment package
        uses: actions/upload-artifact@v7
        with:
          name: backend-package
          path: deployment.zip
          if-no-files-found: error
          retention-days: 1

  authorize:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout target history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup target Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Reverify backend deployment target before Azure upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-backend-deployment-target.mjs --requeue-current

  deploy:
    needs: authorize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout deployment receipt
        uses: actions/checkout@v5

      - name: Checkout deployment target history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: .deployment-target
          persist-credentials: false

      - name: Setup deployment Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download backend deployment package
        uses: actions/download-artifact@v8
        with:
          name: backend-package
          path: .

      - name: Verify deployment package identity
        id: backend_package_identity
        run: |
          test "$(unzip -Z1 deployment.zip | grep -c '^deployment.json$')" -eq 1
          test "$(unzip -p deployment.zip deployment.json)" = "{\"sha\":\"$GITHUB_SHA\"}"
          echo "sha256=$(sha256sum deployment.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify deployment target inside deploy before Azure login
        working-directory: .deployment-target
        run: node scripts/check-backend-deployment-target.mjs

      - name: Azure Login (attempt 1)
        id: azure_login_first
        uses: azure/login@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (attempt 2)
        id: azure_login_second
        if: steps.azure_login_first.outcome == 'failure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        if: steps.azure_login_first.outcome == 'failure' && steps.azure_login_second.outcome == 'failure'
        run: |
          echo "Azure login failed twice. Please verify OIDC federated credential and subscription access for the configured service principal."
          exit 1

      - name: Ensure production auth CORS origins
        run: |
          az functionapp cors add \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
            --allowed-origins \
              https://cloudphotos.top \
              https://www.cloudphotos.top \
              https://brave-sand-053b07a00.7.azurestaticapps.net \
            --output none
          allowed_origins="$(az functionapp cors show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
            --query 'allowedOrigins[]' \
            --output tsv)"
          for required_origin in \
            https://cloudphotos.top \
            https://www.cloudphotos.top \
            https://brave-sand-053b07a00.7.azurestaticapps.net
          do
            if ! grep -Fqx "$required_origin" <<< "$allowed_origins"; then
              echo "Required production auth CORS origin is missing: $required_origin"
              exit 1
            fi
          done
          if grep -Fqx "*" <<< "$allowed_origins"; then
            echo "Wildcard production auth CORS is forbidden"
            exit 1
          fi

      - name: Reverify deployment target immediately before Azure upload
        working-directory: .deployment-target
        run: node scripts/check-backend-deployment-target.mjs

      - name: Deploy to Azure Functions
        run: |
          test "$(sha256sum deployment.zip | awk '{print $1}')" = "${{ steps.backend_package_identity.outputs.sha256 }}"
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
            --src deployment.zip

      - name: Record canonical backend deployment receipt
        env:
          PRODUCTION_BACKEND_DEPLOYED_SHA: ${{ github.sha }}
          PRODUCTION_SMOKE_SCOPE: backend-deployment
        run: node scripts/production-smoke.mjs
