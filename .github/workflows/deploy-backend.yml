name: Deploy Backend (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - "packages/algorithm/**"
      - "packages/server/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Verify workflow runtimes
        run: node scripts/check-workflow-runtime-contracts.mjs

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn workspace cloudphoto-server build

      - name: Test backend
        run: yarn workspace cloudphoto-server test:unit

      - name: Azure Login (attempt 1)
        id: azure_login_first
        uses: azure/login@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login (attempt 2)
        id: azure_login_second
        if: steps.azure_login_first.outcome == 'failure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        if: steps.azure_login_first.outcome == 'failure' && steps.azure_login_second.outcome == 'failure'
        run: |
          echo "Azure login failed twice. Please verify OIDC federated credential and subscription access for the configured service principal."
          exit 1

      - name: Create deployment package
        run: |
          mkdir -p deploy-stage
          cp -r packages/server/dist deploy-stage/
          cp packages/server/package.json deploy-stage/
          cp packages/server/host.json deploy-stage/
          cp packages/server/.funcignore deploy-stage/ 2>/dev/null || true
          cd deploy-stage
          npm install --production --no-package-lock
          # Azure Functions runs on Windows — directly download the Windows sharp binary
          # from npm registry, bypassing npm's platform check entirely.
          SHARP_VER=$(node -e "console.log(require('./node_modules/sharp/package.json').version)")
          mkdir -p node_modules/@img/sharp-win32-x64
          curl -sL "https://registry.npmjs.org/@img/sharp-win32-x64/-/sharp-win32-x64-${SHARP_VER}.tgz" \
            | tar xz --strip-components=1 -C node_modules/@img/sharp-win32-x64
          zip -r ../deployment.zip .

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
            --src deployment.zip
