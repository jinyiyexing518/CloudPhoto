name: Production Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows:
      - Deploy Frontend (Azure Static Web Apps)
      - Deploy Backend (Azure Functions)
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-health-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('failure-{0}', github.event.workflow_run.id) || 'latest' }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Classify deployment event
        id: deployment_event
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOYMENT_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOYMENT_RUN_ID/jobs?per_page=100" | node scripts/classify-deployment-event.mjs --workflow "$DEPLOYMENT_WORKFLOW" >> "$GITHUB_OUTPUT"

      - name: Reject failed deployment
        if: github.event_name == 'workflow_run' && steps.deployment_event.outputs.deployment_started == 'true' && github.event.workflow_run.conclusion != 'success'
        env:
          DEPLOYMENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          DEPLOYMENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "::error::${DEPLOYMENT_WORKFLOW} finished with ${DEPLOYMENT_CONCLUSION}; production health cannot pass."
          exit 1

      - name: Test workflow runtime parser
        if: github.event_name != 'workflow_run' || steps.deployment_event.outputs.deployment_started == 'true'
        run: node --test scripts/workflow-runtime-contracts.test.mjs

      - name: Verify workflow runtimes
        if: github.event_name != 'workflow_run' || steps.deployment_event.outputs.deployment_started == 'true'
        run: node scripts/check-workflow-runtime-contracts.mjs

      - name: Test smoke checks
        if: github.event_name != 'workflow_run' || steps.deployment_event.outputs.deployment_started == 'true'
        run: node --test scripts/production-smoke.test.mjs

      - name: Verify security header contracts
        if: github.event_name != 'workflow_run' || steps.deployment_event.outputs.deployment_started == 'true'
        run: yarn test:security

      - name: Check production
        if: github.event_name != 'workflow_run' || steps.deployment_event.outputs.deployment_started == 'true'
        run: node scripts/production-smoke.mjs
